name: FridayX IDE extensions

# Builds the VS Code extension (one .vsix per published platform) on every change under ide/, and publishes
# them when a tag `ide-v<version>` is pushed. Publishing needs the secrets below; without them the build still
# runs and the artifacts are attached to the run, so nothing is ever published by accident.
#   VSCE_PAT         VS Code Marketplace token (publisher: billionairestechnologies)
#   OVSX_PAT         Open VSX token (Cursor, Windsurf, VSCodium read from here)

on:
  push:
    branches: [main]
    paths: ["ide/**", ".github/workflows/friday-x-ide.yml"]
    tags: ["ide-v*"]
  pull_request:
    paths: ["ide/**"]
  # Run it by hand to (re)publish the current main to one marketplace, e.g. Open VSX only after its token is set.
  workflow_dispatch:
    inputs:
      publish:
        description: "Where to publish the built packages (none = build only)"
        type: choice
        options: [none, openvsx, vscode, both]
        default: none

jobs:
  # One package per platform, each with the `friday` agent inside (resources/native-binary), so the Marketplace
  # delivers the right engine with the extension and the first run needs no download. The binary is fetched from the
  # Friday release server at build time and its SHA-256 is verified there.
  vscode:
    runs-on: ubuntu-latest
    # Tokens at JOB level: a step's own `env:` is not visible to that same step's `if:`.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    strategy:
      fail-fast: false
      matrix:
        # Only the platforms the Friday release server has binaries for (checked 2026-10-08: darwin-arm64, linux-x64,
        # windows-x64). Add darwin-x64, linux-arm64, alpine-x64/arm64, win32-arm64 here once their friday-X binaries are
        # uploaded to the releases bucket; until then those users are told this platform isn't available yet.
        target: [darwin-arm64, linux-x64, win32-x64]
    defaults: { run: { working-directory: ide/vscode } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/fetch-agent.mjs ${{ matrix.target }}
      - run: npm run package:target -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with: { name: "friday-x-vsix-${{ matrix.target }}", path: ide/vscode/*.vsix }
      # --skip-duplicate makes a re-run harmless when a platform build is already published.
      - name: Publish to VS Code Marketplace
        if: (startsWith(github.ref, 'refs/tags/ide-v') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["vscode","both"]'), inputs.publish))) && env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --allow-missing-repository --skip-duplicate --packagePath *.vsix
      - name: Publish to Open VSX
        if: (startsWith(github.ref, 'refs/tags/ide-v') || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["openvsx","both"]'), inputs.publish))) && env.OVSX_PAT != ''
        run: npx ovsx publish --packagePath *.vsix --target ${{ matrix.target }} --skip-duplicate -p "$OVSX_PAT"
